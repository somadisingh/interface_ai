[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM-driven discovery, typed capability artifacts, deterministic replay, and human handoff."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "playwright==1.56.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
cua = "cua.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "src/mockcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["cua", "mockcore"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
